<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Сцена з текстурами та анімацією</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        #container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui { position: absolute; top: 15px; left: 15px; z-index: 10; color: white; background: rgba(0, 0, 0, 0.7); padding: 15px; border-radius: 8px; border: 1px solid #00ffcc; }
        #startButton { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 15px 30px; background-color: #00ffcc; color: #000; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.3s; }
        #startButton:hover { background-color: #00ccaa; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <strong>Виконав:</strong> Смульський Артур<br>
        <strong>Група:</strong> І-22<br>
        <em>Наведіть камеру на картинку-маркер</em>
    </div>
    
    <button id="startButton">Увімкнути AR-камеру</button>
    <div id="container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { MindARThree } from 'mindar-image-three';

        const mindarThree = new MindARThree({
            container: document.querySelector("#container"),
            imageTargetSrc: "targets.mind"
        });
        const {renderer, scene, camera} = mindarThree;
        const anchor = mindarThree.addAnchor(0);

        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin("anonymous");

        // 1. ВАШЕ ФОТО (Я змінив на avatar.jpg, як у вас у репозиторії)
        const texAvatar = loader.load('avatar.jpg');
        const obj1 = new THREE.Mesh(
            new THREE.PlaneGeometry(0.4, 0.4),
            new THREE.MeshBasicMaterial({ map: texAvatar, side: THREE.DoubleSide })
        );
        obj1.position.set(-0.6, 0, 0);
        anchor.group.add(obj1);

        // 2. ОФІЦІЙНА ТЕСТОВА ТЕКСТУРА 1 (Гарантовано працює)
        const texBox = loader.load('https://threejs.org/examples/textures/crate.gif');
        const obj2 = new THREE.Mesh(
            new THREE.BoxGeometry(0.3, 0.3, 0.3),
            new THREE.MeshBasicMaterial({ map: texBox })
        );
        obj2.position.set(0, 0, 0);
        anchor.group.add(obj2);

        // 3. ОФІЦІЙНА ТЕСТОВА ТЕКСТУРА 2 (Гарантовано працює)
        const texSphere = loader.load('https://threejs.org/examples/textures/uv_grid_opengl.jpg');
        const obj3 = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 32, 32),
            new THREE.MeshBasicMaterial({ map: texSphere })
        );
        obj3.position.set(0.6, 0, 0);
        anchor.group.add(obj3);

        const clock = new THREE.Clock();

        const startButton = document.querySelector("#startButton");
        startButton.addEventListener("click", async () => {
            startButton.style.display = "none";
            await mindarThree.start();
            
            renderer.setAnimationLoop(() => {
                const time = clock.getElapsedTime();

                // а) ПЕРЕМІЩЕННЯ
                obj1.position.y = Math.sin(time * 3) * 0.2;

                // б) ОБЕРТАННЯ
                obj2.rotation.x += 0.02;
                obj2.rotation.y += 0.02;

                // в) МАСШТАБУВАННЯ
                const s = 1 + Math.sin(time * 4) * 0.3;
                obj3.scale.set(s, s, s);

                renderer.render(scene, camera);
            });
        });
    </script>
</body>
</html>
